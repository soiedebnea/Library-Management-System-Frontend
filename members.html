<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Members — Library Management System</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="brand-mark">LMS</span> Reading Room</div>
    <nav class="main-nav">
      <a href="index.html">Dashboard</a>
      <a href="books.html">Books</a>
      <a href="members.html" class="active">Members</a>
      <a href="borrow.html">Borrow &amp; Return</a>
    </nav>
  </div>
</header>

<main class="page">
  <div class="page-head">
    <div>
      <h1>Members</h1>
      <p class="subtitle">Register readers and manage their accounts.</p>
    </div>
  </div>

  <section class="panel">
    <h2 id="form-title">Register a New Member</h2>
    <form id="member-form">
      <div class="form-grid">
        <div class="field">
          <label for="name">Full Name</label>
          <input id="name" name="name" type="text" required placeholder="Ayesha Rahman" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required placeholder="ayesha@example.com" />
        </div>
        <div class="field">
          <label for="phone">Phone</label>
          <input id="phone" name="phone" type="text" placeholder="01710000000" />
        </div>
        <div class="field">
          <label for="address">Address</label>
          <input id="address" name="address" type="text" placeholder="House 12, Road 5, Dhaka" />
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" id="submit-btn" class="btn btn-primary">Register Member</button>
        <button type="button" id="cancel-edit-btn" class="btn btn-ghost" hidden>Cancel Edit</button>
      </div>
    </form>
  </section>

  <section class="panel">
    <div class="form-grid" style="margin-bottom: 16px;">
      <div class="field">
        <label for="search-input">Search Members</label>
        <input id="search-input" type="text" placeholder="Search by name or email…" />
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Joined</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="members-body">
          <tr><td colspan="6">Loading members…</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<footer class="site-footer">Library Management System — books, members, loans, and fines in one place.</footer>

<script type="module" src="js/members.js"></script>
</body>
</html>
