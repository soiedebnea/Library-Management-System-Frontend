<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Books — Library Management System</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="brand-mark">LMS</span> Reading Room</div>
    <nav class="main-nav">
      <a href="index.html">Dashboard</a>
      <a href="books.html" class="active">Books</a>
      <a href="members.html">Members</a>
      <a href="borrow.html">Borrow &amp; Return</a>
    </nav>
  </div>
</header>

<main class="page">
  <div class="page-head">
    <div>
      <h1>Book Catalog</h1>
      <p class="subtitle">Add titles, track copies, and manage the collection.</p>
    </div>
  </div>

  <section class="panel">
    <h2 id="form-title">Add a New Book</h2>
    <form id="book-form">
      <div class="form-grid">
        <div class="field">
          <label for="title">Title</label>
          <input id="title" name="title" type="text" required placeholder="Clean Code" />
        </div>
        <div class="field">
          <label for="author">Author</label>
          <input id="author" name="author" type="text" required placeholder="Robert C. Martin" />
        </div>
        <div class="field">
          <label for="isbn">ISBN</label>
          <input id="isbn" name="isbn" type="text" required placeholder="9780132350884" />
        </div>
        <div class="field">
          <label for="category">Category</label>
          <input id="category" name="category" type="text" required placeholder="Software Engineering" />
        </div>
        <div class="field">
          <label for="publisher">Publisher</label>
          <input id="publisher" name="publisher" type="text" placeholder="Prentice Hall" />
        </div>
        <div class="field">
          <label for="totalCopies">Total Copies</label>
          <input id="totalCopies" name="totalCopies" type="number" min="1" value="1" required />
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" id="submit-btn" class="btn btn-primary">Add Book</button>
        <button type="button" id="cancel-edit-btn" class="btn btn-ghost" hidden>Cancel Edit</button>
      </div>
    </form>
  </section>

  <section class="panel">
    <div class="form-grid" style="margin-bottom: 16px;">
      <div class="field">
        <label for="search-input">Search Catalog</label>
        <input id="search-input" type="text" placeholder="Search by title, author, or ISBN…" />
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Author</th>
            <th>ISBN</th>
            <th>Category</th>
            <th>Copies</th>
            <th>Availability</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="books-body">
          <tr><td colspan="7">Loading books…</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<footer class="site-footer">Library Management System — books, members, loans, and fines in one place.</footer>

<script type="module" src="js/books.js"></script>
</body>
</html>
